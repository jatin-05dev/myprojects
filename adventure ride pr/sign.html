 <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="sign.css">
   
</head>

<body>
  <section id="mm">
    <div id="main">
      <h1>Sign Up</h1>
      <form id="sig">
        <label for="name">Name</label>
        <input required type="text" id="name" placeholder="Enter your name">

        <label for="phone">Phone</label>
        <input required type="number" id="phone" placeholder="Enter phone number">

        <label for="email">Email</label>
        <input required type="email" id="email" placeholder="Enter email">

        <label for="adress">Address</label>
        <input required type="text" id="adress" placeholder="Enter address">

        <label for="city">City</label>
        <input required type="text" id="city" placeholder="Enter city">

        <label for="password">Password</label>
        <input required type="text" id="password" placeholder="Enter password">

        <label for="username">Username</label>
        <input required type="text" id="username" placeholder="Enter username">

        <input type="submit" value="Sign Up">
        <br><br>
     
        
      </form>
        
    </div>
  </section>
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
   
  <script src="sign.js"></script>
</body>

</html>
